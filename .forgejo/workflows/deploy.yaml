name: Deploy legal documents

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: linux-arm64-minimal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Test nginx configuration
        run: |
          sudo nginx -t -c nginx-conf/nginx.conf

      - name: Install python3
        run: |
          sudo apt install python3 -y # Skip Yes/No query

      - name: Minimize legal documents
        run: |
          python3 tools/minimize_html_css.py legal/*

      - name: Copy legal documents
        run: |
          sudo cp -r legal/* /var/www/html/src/

      - name: Copy nginx configuration
        run: |
          sudo cp nginx-conf/nginx.conf /etc/nginx/nginx.conf
          sudo cp nginx-conf/sites-available/* /etc/nginx/sites-available/
          sudo ln -sf /etc/nginx/sites-available/forgejo /etc/nginx/sites-enabled/forgejo

      - name: Reload nginx
        run: |
          sudo systemctl reload nginx

